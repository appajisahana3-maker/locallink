<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LocalLink | Account</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #17202a;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 6%;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .container {
      width: 92%;
      max-width: 500px;
      margin: 40px auto;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      color: #111827;
      text-decoration: none;
      font-weight: bold;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      border: 1px solid #e4e7ec;
    }

    h1 {
      margin-bottom: 10px;
    }

    .intro {
      color: #667085;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d0d5dd;
      border-radius: 9px;
      font-size: 16px;
    }

    .main-button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-top: 5px;
    }

    .main-button:hover {
      background: #374151;
    }

    .main-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 9px;
      display: none;
      line-height: 1.5;
      background: #f3f4f6;
      color: #374151;
    }

    .switch {
      margin-top: 20px;
      text-align: center;
      color: #667085;
      line-height: 1.6;
    }

    .switch button {
      background: none;
      border: none;
      color: #111827;
      padding: 5px;
      width: auto;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    .switch button:hover {
      text-decoration: underline;
    }

    .confirmation {
      text-align: center;
      padding: 10px 0;
    }

    .confirmation h2 {
      margin-bottom: 12px;
    }

    .confirmation p {
      color: #667085;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .hidden {
      display: none;
    }

    footer {
      margin-top: 60px;
      background: #111827;
      color: white;
      text-align: center;
      padding: 30px;
    }

    @media (max-width: 600px) {
      .card {
        padding: 24px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">LocalLink</div>
</header>


<main class="container">

  <a href="index.html" class="back">
    ← Back to LocalLink
  </a>


  <div class="card">

    <!-- =========================
         AUTH FORM
    ========================== -->

    <div id="authSection">

      <h1 id="title">
        Create your account
      </h1>

      <p class="intro" id="intro">
        Create a secure LocalLink account to use the platform.
      </p>


      <form id="authForm">

        <div class="field">

          <label for="email">
            Email
          </label>

          <input
            id="email"
            type="email"
            placeholder="you@example.com"
            required
          >

        </div>


        <div class="field">

          <label for="password">
            Password
          </label>

          <input
            id="password"
            type="password"
            placeholder="Enter your password"
            minlength="6"
            required
          >

        </div>


        <button
          type="submit"
          class="main-button"
          id="submitButton"
        >
          Create Account
        </button>

      </form>


      <div
        class="message"
        id="message"
      ></div>


      <div class="switch">

        <span id="switchText">
          Already have an account?
        </span>

        <button
          type="button"
          id="switchButton"
        >
          Log In
        </button>

      </div>

    </div>


    <!-- =========================
         EMAIL CONFIRMATION
    ========================== -->

    <div
      id="confirmationSection"
      class="confirmation hidden"
    >

      <h2>
        Account created
      </h2>

      <p>
        Your LocalLink account has been created.
        Please check your email and confirm your account.
      </p>

      <button
        type="button"
        class="main-button"
        id="goToLoginButton"
      >
        Go to Log In
      </button>

    </div>

  </div>

</main>


<footer>

  <p>
    <strong>LocalLink</strong>
  </p>

  <br>

  <p>
    Connecting customers with local businesses.
  </p>

</footer>


<!-- =========================
     SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://vyfuuvsuewzsoyjdfjfu.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_9if2DNlYzWq4GtmQjOx9BQ_nqCdHCEm";


const localLinkSupabase =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================
   ELEMENTS
========================= */

const form =
  document.getElementById("authForm");

const title =
  document.getElementById("title");

const intro =
  document.getElementById("intro");

const submitButton =
  document.getElementById("submitButton");

const switchText =
  document.getElementById("switchText");

const switchButton =
  document.getElementById("switchButton");

const message =
  document.getElementById("message");

const authSection =
  document.getElementById("authSection");

const confirmationSection =
  document.getElementById("confirmationSection");

const goToLoginButton =
  document.getElementById("goToLoginButton");


let loginMode = false;


/* =========================
   MESSAGE
========================= */

function showMessage(text) {

  message.textContent = text;

  message.style.display = "block";

}


/* =========================
   LOGIN MODE
========================= */

function showLogin() {

  loginMode = true;

  message.style.display = "none";

  form.reset();

  title.textContent =
    "Log in";

  intro.textContent =
    "Log in to your LocalLink account.";

  document
    .querySelector('label[for="password"]')
    .textContent =
    "Password";

  document
    .getElementById("password")
    .placeholder =
    "Enter your password";

  submitButton.textContent =
    "Log In";

  switchText.textContent =
    "Don't have an account?";

  switchButton.textContent =
    "Create Account";

}


/* =========================
   SIGNUP MODE
========================= */

function showSignup() {

  loginMode = false;

  message.style.display = "none";

  form.reset();

  title.textContent =
    "Create your account";

  intro.textContent =
    "Create a secure LocalLink account to use the platform.";

  document
    .querySelector('label[for="password"]')
    .textContent =
    "Password";

  document
    .getElementById("password")
    .placeholder =
    "Create a password";

  submitButton.textContent =
    "Create Account";

  switchText.textContent =
    "Already have an account?";

  switchButton.textContent =
    "Log In";

}


/* =========================
   URL MODE
========================= */

const params =
  new URLSearchParams(window.location.search);

if (params.get("signup") === "true") {

  showSignup();

} else {

  showLogin();

}


/* =========================
   SWITCH
========================= */

switchButton.addEventListener(
  "click",
  function() {

    if (loginMode) {

      showSignup();

    } else {

      showLogin();

    }

  }
);


/* =========================
   FORM SUBMISSION
========================= */

form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const email =
      document
        .getElementById("email")
        .value
        .trim();


    const password =
      document
        .getElementById("password")
        .value;


    submitButton.disabled = true;


    /* =========================
       LOGIN
    ========================== */

    if (loginMode) {

      const { error } =
        await localLinkSupabase.auth
          .signInWithPassword({
            email: email,
            password: password
          });


      if (error) {

        showMessage(
          "Login failed: " +
          error.message
        );

        submitButton.disabled = false;

        return;
      }


      window.location.href =
        "index.html";

      return;
    }


    /* =========================
       SIGNUP
    ========================== */

    const { data, error } =
      await localLinkSupabase.auth
        .signUp({
          email: email,
          password: password
        });


    if (error) {

      showMessage(
        "Account creation failed: " +
        error.message
      );

      submitButton.disabled = false;

      return;
    }


    /* =========================
       SUCCESSFUL SIGNUP
    ========================== */

    if (data) {

      authSection.classList.add("hidden");

      confirmationSection.classList.remove("hidden");

    }

  }
);


/* =========================
   GO TO LOGIN
========================= */

goToLoginButton.addEventListener(
  "click",
  function() {

    confirmationSection.classList.add(
      "hidden"
    );

    authSection.classList.remove(
      "hidden"
    );

    showLogin();

  }
);

</script>

</body>
</html>
