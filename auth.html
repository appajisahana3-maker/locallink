<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LocalLink | Account</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #17202a;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 6%;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .container {
      width: 92%;
      max-width: 500px;
      margin: 40px auto;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      color: #111827;
      text-decoration: none;
      font-weight: bold;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      border: 1px solid #e4e7ec;
    }

    h1 {
      margin-bottom: 10px;
    }

    .intro {
      color: #667085;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d0d5dd;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-top: 5px;
    }

    button:hover {
      background: #374151;
    }

    .message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 9px;
      display: none;
      line-height: 1.5;
    }

    .switch {
      margin-top: 20px;
      text-align: center;
      color: #667085;
    }

    .switch button {
      background: none;
      color: #111827;
      padding: 5px;
      width: auto;
      font-weight: bold;
    }

    footer {
      margin-top: 60px;
      background: #111827;
      color: white;
      text-align: center;
      padding: 30px;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">LocalLink</div>
</header>

<main class="container">

  <a href="index.html" class="back">
    ← Back to LocalLink
  </a>

  <div class="card">

    <h1 id="title">Create your account</h1>

    <p class="intro" id="intro">
      Create a secure LocalLink account to use the platform.
    </p>

    <form id="authForm">

      <div class="field">
        <label for="email">Email</label>

        <input
          id="email"
          type="email"
          placeholder="you@example.com"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>

        <input
          id="password"
          type="password"
          placeholder="Create a password"
          minlength="6"
          required
        >
      </div>

      <button type="submit" id="submitButton">
        Create Account
      </button>

    </form>

    <div class="message" id="message"></div>

    <div class="switch">
      <span id="switchText">
        Already have an account?
      </span>

      <button type="button" id="switchButton">
        Log in
      </button>
    </div>

  </div>

</main>

<footer>
  <p><strong>LocalLink</strong></p>
  <p>Connecting customers with local businesses.</p>
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://vyfuuvsuewzsoyjdfjfu.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_9if2DNlYzWq4GtmQjOx9BQ_nqCdHCEm";


const localLinkSupabase =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


let loginMode = false;


const form =
  document.getElementById("authForm");

const title =
  document.getElementById("title");

const intro =
  document.getElementById("intro");

const submitButton =
  document.getElementById("submitButton");

const switchText =
  document.getElementById("switchText");

const switchButton =
  document.getElementById("switchButton");

const message =
  document.getElementById("message");


function showMessage(text) {

  message.textContent = text;
  message.style.display = "block";

}


switchButton.addEventListener("click", function() {

  loginMode = !loginMode;

  message.style.display = "none";
  form.reset();

  if (loginMode) {

    title.textContent = "Log in";

    intro.textContent =
      "Log in to your LocalLink account.";

    submitButton.textContent =
      "Log In";

    switchText.textContent =
      "Don't have an account?";

    switchButton.textContent =
      "Create account";

  } else {

    title.textContent =
      "Create your account";

    intro.textContent =
      "Create a secure LocalLink account to use the platform.";

    submitButton.textContent =
      "Create Account";

    switchText.textContent =
      "Already have an account?";

    switchButton.textContent =
      "Log in";

  }

});


form.addEventListener("submit", async function(event) {

  event.preventDefault();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;


  submitButton.disabled = true;


  if (loginMode) {

    const { error } =
      await localLinkSupabase.auth.signInWithPassword({
        email: email,
        password: password
      });


    if (error) {

      showMessage(
        "Login failed: " + error.message
      );

      submitButton.disabled = false;

      return;
    }


    window.location.href = "index.html";

  } else {

    const { error } =
      await localLinkSupabase.auth.signUp({
        email: email,
        password: password
      });


    if (error) {

      showMessage(
        "Account creation failed: " +
        error.message
      );

      submitButton.disabled = false;

      return;
    }


    showMessage(
      "Account created. Please check your email and confirm your account before logging in."
    );

    form.reset();

    submitButton.disabled = false;

  }

});

</script>

</body>
</html>
