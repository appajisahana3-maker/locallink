<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LocalLink | Business</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at 10% 0%, #e8eefc 0%, transparent 32%),
        radial-gradient(circle at 90% 20%, #eef2ff 0%, transparent 28%),
        #f6f8fb;
      color: #101828;
      min-height: 100vh;
    }

    header {
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(17, 24, 39, 0.94);
      color: white;
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(15px);
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .future-mark {
      font-size: 12px;
      opacity: 0.65;
      letter-spacing: 2px;
    }

    .container {
      width: 92%;
      max-width: 900px;
      margin: 28px auto 70px;
    }

    .back {
      display: inline-block;
      margin-bottom: 22px;
      color: #344054;
      text-decoration: none;
      font-weight: 700;
    }

    .loading,
    .error {
      background: white;
      border: 1px solid #e4e7ec;
      border-radius: 24px;
      padding: 35px;
      text-align: center;
      line-height: 1.6;
    }

    .error {
      color: #b42318;
    }

    /* Main identity */

    .identity {
      position: relative;
      overflow: hidden;
      background: #111827;
      color: white;
      border-radius: 30px;
      padding: 34px;
      box-shadow: 0 20px 60px rgba(16, 24, 40, 0.16);
    }

    .identity::before {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 50%;
      right: -80px;
      top: -80px;
    }

    .identity::after {
      content: "";
      position: absolute;
      width: 150px;
      height: 150px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 50%;
      right: 30px;
      top: 30px;
    }

    .identity-content {
      position: relative;
      z-index: 2;
    }

    .identity-label {
      font-size: 11px;
      letter-spacing: 3px;
      opacity: 0.55;
      margin-bottom: 15px;
      text-transform: uppercase;
    }

    .business-name {
      font-size: clamp(32px, 7vw, 58px);
      line-height: 1;
      letter-spacing: -2px;
      margin-bottom: 18px;
    }

    .category-line {
      color: #d0d5dd;
      font-size: 15px;
      line-height: 1.6;
    }

    .location-chip {
      display: inline-flex;
      margin-top: 20px;
      padding: 9px 13px;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 999px;
      font-size: 13px;
      background: rgba(255,255,255,0.06);
    }

    /* Adaptive capabilities */

    .capabilities {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .capability {
      background: white;
      border: 1px solid #e4e7ec;
      border-radius: 22px;
      padding: 22px;
      min-height: 125px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .capability:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(16, 24, 40, 0.08);
    }

    .capability-number {
      font-size: 11px;
      color: #98a2b3;
      letter-spacing: 2px;
      margin-bottom: 18px;
    }

    .capability-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 7px;
    }

    .capability-text {
      color: #667085;
      font-size: 13px;
      line-height: 1.5;
    }

    /* Sections */

    .section {
      margin-top: 18px;
      background: white;
      border: 1px solid #e4e7ec;
      border-radius: 24px;
      padding: 27px;
    }

    .section-label {
      color: #98a2b3;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .section h2 {
      font-size: 22px;
      margin-bottom: 13px;
    }

    .section p {
      color: #475467;
      line-height: 1.75;
      white-space: pre-wrap;
    }

    /* Truth layer */

    .truth {
      display: grid;
      gap: 10px;
      margin-top: 17px;
    }

    .truth-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 15px;
      background: #f8fafc;
      border-radius: 14px;
    }

    .truth-label {
      color: #667085;
      font-size: 13px;
    }

    .truth-value {
      font-weight: 700;
      font-size: 13px;
      text-align: right;
    }

    /* Information */

    .info {
      display: grid;
      gap: 11px;
    }

    .info-row {
      padding: 16px;
      background: #f8fafc;
      border-radius: 14px;
    }

    .info-label {
      display: block;
      font-size: 12px;
      color: #667085;
      margin-bottom: 5px;
    }

    .info-value {
      font-weight: 700;
      color: #17202a;
      line-height: 1.5;
      word-break: break-word;
    }

    /* Future website area */

    .future-box {
      background: #111827;
      color: white;
      border-radius: 24px;
      padding: 25px;
      margin-top: 18px;
    }

    .future-box .section-label {
      color: #98a2b3;
    }

    .future-box h2 {
      margin-bottom: 10px;
    }

    .future-box p {
      color: #d0d5dd;
      line-height: 1.6;
      font-size: 14px;
    }

    .future-status {
      display: inline-block;
      margin-top: 18px;
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 999px;
      font-size: 12px;
      color: #d0d5dd;
    }

    footer {
      background: #111827;
      color: white;
      text-align: center;
      padding: 30px;
      line-height: 1.7;
    }

    footer p:last-child {
      color: #98a2b3;
      font-size: 13px;
    }

    @media (max-width: 600px) {

      .identity {
        padding: 27px;
        border-radius: 25px;
      }

      .capabilities {
        grid-template-columns: 1fr;
      }

      .section {
        padding: 22px;
      }

      .truth-row {
        flex-direction: column;
      }

      .truth-value {
        text-align: left;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    LocalLink
  </div>

  <div class="future-mark">
    2095
  </div>

</header>


<main class="container">

  <a
    href="index.html?skipSplash=true"
    class="back"
  >
    ← Back to LocalLink
  </a>


  <div id="content">

    <div class="loading">
      Loading business...
    </div>

  </div>

</main>


<footer>

  <p>
    <strong>LocalLink</strong>
  </p>

  <p>
    Local business information, presented honestly.
  </p>

</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const SUPABASE_URL =
    "https://vyfuuvsuewzsoyjdfjfu.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_9if2DNlYzWq4GtmQjOx9BQ_nqCdHCEm";


  const localLinkSupabase =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  const content =
    document.getElementById("content");


  /*
    These are interface descriptions only.

    They do NOT pretend that ordering,
    booking, payment, reviews, etc. already work.
  */

  function getCapabilities(mainCategory, subCategory) {

    const category =
      String(mainCategory || "").toLowerCase();

    const sub =
      String(subCategory || "").toLowerCase();


    if (
      category.includes("food") ||
      sub.includes("restaurant") ||
      sub.includes("bakery") ||
      sub.includes("cafe")
    ) {

      return [
        [
          "01",
          "What they offer",
          "Food, products and services supplied by this business."
        ],
        [
          "02",
          "Customer information",
          "Discover the business, location and available information."
        ],
        [
          "03",
          "Direct contact",
          "Use the real contact information supplied by the business."
        ],
        [
          "04",
          "Future commerce",
          "Ordering and delivery can be connected here when those systems are built."
        ]
      ];

    }


    if (
      category.includes("manufacturing") ||
      sub.includes("manufacturer") ||
      sub.includes("wholesaler") ||
      sub.includes("distributor")
    ) {

      return [
        [
          "01",
          "Products & supply",
          "Understand what this business manufactures or supplies."
        ],
        [
          "02",
          "Business enquiry",
          "A future enquiry system can connect customers and suppliers."
        ],
        [
          "03",
          "Business identity",
          "View the real information supplied by the business."
        ],
        [
          "04",
          "Future commerce",
          "Wholesale ordering can be connected when that system is built."
        ]
      ];

    }


    if (
      category.includes("education") ||
      sub.includes("school") ||
      sub.includes("tuition") ||
      sub.includes("coaching")
    ) {

      return [
        [
          "01",
          "Learning",
          "Explore the educational services offered by this business."
        ],
        [
          "02",
          "Programs",
          "Courses and programs can be displayed here."
        ],
        [
          "03",
          "Direct contact",
          "Use the real contact information supplied by the business."
        ],
        [
          "04",
          "Future admissions",
          "Online enquiries and applications can be connected later."
        ]
      ];

    }


    if (
      category.includes("transport") ||
      sub.includes("cab") ||
      sub.includes("taxi") ||
      sub.includes("delivery") ||
      sub.includes("logistics")
    ) {

      return [
        [
          "01",
          "Transport service",
          "Understand the transport service offered by this business."
        ],
        [
          "02",
          "Service area",
          "Service-area information can be displayed here."
        ],
        [
          "03",
          "Direct contact",
          "Use the real contact information supplied by the business."
        ],
        [
          "04",
          "Future booking",
          "Booking can be connected when the real booking system is built."
        ]
      ];

    }


    if (
      category.includes("entertainment") ||
      category.includes("media") ||
      sub.includes("events") ||
      sub.includes("video") ||
      sub.includes("music")
    ) {

      return [
        [
          "01",
          "Media & work",
          "Show the creative work and services offered by this business."
        ],
        [
          "02",
          "Portfolio",
          "Photos and videos can become part of the business profile."
        ],
        [
          "03",
          "Direct contact",
          "Use the real contact information supplied by the business."
        ],
        [
          "04",
          "Future applications",
          "Auditions, enquiries and submissions can be connected later."
        ]
      ];

    }


    return [
      [
        "01",
        "What they offer",
        "Understand the products or services offered by this business."
      ],
      [
        "02",
        "Business identity",
        "View the real information supplied by the business."
      ],
      [
        "03",
        "Direct contact",
        "Use the real contact information supplied by the business."
      ],
      [
        "04",
        "Future services",
        "More business tools can be connected here as LocalLink grows."
      ]
    ];

  }


  function renderCapabilities(mainCategory, subCategory) {

    const capabilities =
      getCapabilities(
        mainCategory,
        subCategory
      );


    return capabilities.map(function(item) {

      return `

        <div class="capability">

          <div class="capability-number">
            ${item[0]}
          </div>

          <div class="capability-title">
            ${escapeHtml(item[1])}
          </div>

          <div class="capability-text">
            ${escapeHtml(item[2])}
          </div>

        </div>

      `;

    }).join("");

  }


  async function loadBusiness() {

    const params =
      new URLSearchParams(
        window.location.search
      );


    const businessId =
      params.get("id");


    if (!businessId) {

      content.innerHTML = `

        <div class="error">

          <strong>
            Business not found.
          </strong>

          <br><br>

          No business ID was provided.

        </div>

      `;

      return;
    }


    const { data, error } =
      await localLinkSupabase
        .from("businesses")
        .select(`
          id,
          business_name,
          contact_name,
          email,
          phone,
          main_category,
          sub_category,
          city,
          address,
          description,
          created_at
        `)
        .eq("id", businessId)
        .single();


    if (error || !data) {

      console.error(
        "Business details error:",
        error
      );


      content.innerHTML = `

        <div class="error">

          <strong>
            Unable to load this business.
          </strong>

          <br><br>

          The business may not exist
          or may no longer be available.

        </div>

      `;

      return;
    }


    const capabilities =
      renderCapabilities(
        data.main_category,
        data.sub_category
      );


    content.innerHTML = `

      <!-- BUSINESS IDENTITY -->

      <section class="identity">

        <div class="identity-content">

          <div class="identity-label">
            LOCAL BUSINESS
          </div>

          <h1 class="business-name">
            ${escapeHtml(data.business_name)}
          </h1>

          <p class="category-line">
            ${escapeHtml(data.main_category)}
            <br>
            ${escapeHtml(data.sub_category)}
          </p>

          <div class="location-chip">
            ◉ ${escapeHtml(data.city)}
          </div>

        </div>

      </section>


      <!-- ADAPTIVE CAPABILITIES -->

      <section>

        <div style="margin: 25px 0 14px;">

          <div class="section-label">
            BUSINESS INTERFACE
          </div>

          <h2>
            What this business can offer
          </h2>

        </div>

        <div class="capabilities">

          ${capabilities}

        </div>

      </section>


      <!-- ABOUT -->

      <section class="section">

        <div class="section-label">
          THE BUSINESS
        </div>

        <h2>
          About
        </h2>

        <p>
          ${escapeHtml(data.description)}
        </p>

      </section>


      <!-- HONESTY / TRUST -->

      <section class="section">

        <div class="section-label">
          INFORMATION ORIGIN
        </div>

        <h2>
          Know what you're seeing
        </h2>

        <div class="truth">

          <div class="truth-row">

            <span class="truth-label">
              Business information
            </span>

            <span class="truth-value">
              Supplied by business
            </span>

          </div>


          <div class="truth-row">

            <span class="truth-label">
              Business name
            </span>

            <span class="truth-value">
              ${escapeHtml(data.business_name)}
            </span>

          </div>


          <div class="truth-row">

            <span class="truth-label">
              Category
            </span>

            <span class="truth-value">
              ${escapeHtml(data.main_category)}
            </span>

          </div>


          <div class="truth-row">

            <span class="truth-label">
              AI-created information
            </span>

            <span class="truth-value">
              None shown
            </span>

          </div>

        </div>

      </section>


      <!-- LOCATION -->

      <section class="section">

        <div class="section-label">
          WHERE
        </div>

        <h2>
          Location
        </h2>

        <div class="info">

          <div class="info-row">

            <span class="info-label">
              City
            </span>

            <span class="info-value">
              ${escapeHtml(data.city)}
            </span>

          </div>


          <div class="info-row">

            <span class="info-label">
              Address
            </span>

            <span class="info-value">
              ${escapeHtml(data.address)}
            </span>

          </div>

        </div>

      </section>


      <!-- CONTACT -->

      <section class="section">

        <div class="section-label">
          CONNECTION
        </div>

        <h2>
          Contact
        </h2>

        <div class="info">

          <div class="info-row">

            <span class="info-label">
              Contact person
            </span>

            <span class="info-value">
              ${escapeHtml(data.contact_name)}
            </span>

          </div>


          <div class="info-row">

            <span class="info-label">
              Phone
            </span>

            <span class="info-value">
              ${escapeHtml(data.phone)}
            </span>

          </div>


          <div class="info-row">

            <span class="info-label">
              Email
            </span>

            <span class="info-value">
              ${escapeHtml(data.email)}
            </span>

          </div>

        </div>

      </section>


      <!-- FUTURE WEBSITE -->

      <section class="future-box">

        <div class="section-label">
          LOCAL LINK WEBSITE
        </div>

        <h2>
          This business can grow beyond a profile.
        </h2>

        <p>
          A complete public business website will eventually
          live here, with products, services, media and
          business-specific tools.
        </p>

        <span class="future-status">
          Website not created yet
        </span>

      </section>

    `;

  }


  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  loadBusiness();

</script>

</body>
</html>
