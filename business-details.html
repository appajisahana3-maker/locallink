<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LocalLink | Business</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at 10% 0%, #e8eefc 0%, transparent 32%),
        radial-gradient(circle at 90% 20%, #eef2ff 0%, transparent 28%),
        #f6f8fb;
      color: #101828;
      min-height: 100vh;
    }

    header {
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(17, 24, 39, 0.94);
      color: white;
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(15px);
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .container {
      width: 92%;
      max-width: 1000px;
      margin: 28px auto 70px;
    }

    .back {
      display: inline-block;
      margin-bottom: 22px;
      color: #344054;
      text-decoration: none;
      font-weight: 700;
    }

    .loading,
    .error {
      background: white;
      border: 1px solid #e4e7ec;
      border-radius: 24px;
      padding: 35px;
      text-align: center;
      line-height: 1.6;
    }

    .error {
      color: #b42318;
    }

    /* =========================
       BUSINESS IDENTITY
    ========================= */

    .identity {
      position: relative;
      overflow: hidden;
      background: #111827;
      color: white;
      border-radius: 30px;
      padding: 38px;
      box-shadow: 0 20px 60px rgba(16, 24, 40, 0.16);
    }

    .identity::before {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 50%;
      right: -100px;
      top: -100px;
    }

    .identity::after {
      content: "";
      position: absolute;
      width: 170px;
      height: 170px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 50%;
      right: 40px;
      top: 40px;
    }

    .identity-content {
      position: relative;
      z-index: 2;
    }

    .identity-label {
      font-size: 11px;
      letter-spacing: 3px;
      opacity: 0.55;
      margin-bottom: 15px;
      text-transform: uppercase;
    }

    .business-name {
      font-size: clamp(32px, 7vw, 58px);
      line-height: 1;
      letter-spacing: -2px;
      margin-bottom: 18px;
    }

    .category-line {
      color: #d0d5dd;
      font-size: 15px;
      line-height: 1.6;
    }

    .location-chip {
      display: inline-flex;
      margin-top: 20px;
      padding: 9px 13px;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 999px;
      font-size: 13px;
      background: rgba(255,255,255,0.06);
    }

    /* =========================
       PHOTO SHOWCASE
    ========================= */

    .photo-section {
      margin-top: 18px;
      background: #0b1220;
      color: white;
      border-radius: 28px;
      padding: 24px;
      overflow: hidden;
    }

    .photo-heading {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 18px;
    }

    .photo-heading-label {
      color: #98a2b3;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    .photo-heading h2 {
      font-size: 26px;
      line-height: 1.1;
    }

    .photo-heading p {
      color: #98a2b3;
      font-size: 13px;
      line-height: 1.5;
      max-width: 350px;
      text-align: right;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: 1.55fr 1fr;
      grid-template-rows: 230px 150px;
      gap: 10px;
    }

    .photo-card {
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      background: #182230;
      cursor: pointer;
    }

    .photo-card:first-child {
      grid-row: 1 / 3;
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform 0.35s ease;
    }

    .photo-card:hover img {
      transform: scale(1.04);
    }

    .photo-number {
      position: absolute;
      left: 12px;
      bottom: 12px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(8px);
      font-size: 11px;
      color: white;
    }

    .photo-empty {
      padding: 35px 20px;
      border: 1px dashed rgba(255,255,255,0.18);
      border-radius: 18px;
      color: #98a2b3;
      text-align: center;
      line-height: 1.6;
    }

    /* =========================
       PHOTO VIEWER
    ========================= */

    .viewer {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 100;
      padding: 25px;
      align-items: center;
      justify-content: center;
    }

    .viewer.open {
      display: flex;
    }

    .viewer img {
      max-width: 95vw;
      max-height: 88vh;
      object-fit: contain;
      border-radius: 12px;
    }

    .viewer-close {
      position: fixed;
      right: 20px;
      top: 18px;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 50%;
      background: rgba(0,0,0,0.5);
      color: white;
      font-size: 22px;
      cursor: pointer;
    }

    /* =========================
       ADAPTIVE CAPABILITIES
    ========================= */

    .capabilities {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .capability {
      background: white;
      border: 1px solid #e4e7ec;
      border-radius: 22px;
      padding: 22px;
      min-height: 125px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .capability:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(16, 24, 40, 0.08);
    }

    .capability-number {
      font-size: 11px;
      color: #98a2b3;
      letter-spacing: 2px;
      margin-bottom: 18px;
    }

    .capability-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 7px;
    }

    .capability-text {
      color: #667085;
      font-size: 13px;
      line-height: 1.5;
    }

    /* =========================
       SECTIONS
    ========================= */

    .section {
      margin-top: 18px;
      background: white;
      border: 1px solid #e4e7ec;
      border-radius: 24px;
      padding: 27px;
    }

    .section-label {
      color: #98a2b3;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .section h2 {
      font-size: 22px;
      margin-bottom: 13px;
    }

    .section p {
      color: #475467;
      line-height: 1.75;
      white-space: pre-wrap;
    }

    /* =========================
       TRUST LAYER
    ========================= */

    .truth {
      display: grid;
      gap: 10px;
      margin-top: 17px;
    }

    .truth-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 15px;
      background: #f8fafc;
      border-radius: 14px;
    }

    .truth-label {
      color: #667085;
      font-size: 13px;
    }

    .truth-value {
      font-weight: 700;
      font-size: 13px;
      text-align: right;
    }

    /* =========================
       INFORMATION
    ========================= */

    .info {
      display: grid;
      gap: 11px;
    }

    .info-row {
      padding: 16px;
      background: #f8fafc;
      border-radius: 14px;
    }

    .info-label {
      display: block;
      font-size: 12px;
      color: #667085;
      margin-bottom: 5px;
    }

    .info-value {
      font-weight: 700;
      color: #17202a;
      line-height: 1.5;
      word-break: break-word;
    }

    /* =========================
       FUTURE WEBSITE
    ========================= */

    .future-box {
      background: #111827;
      color: white;
      border-radius: 24px;
      padding: 25px;
      margin-top: 18px;
    }

    .future-box .section-label {
      color: #98a2b3;
    }

    .future-box h2 {
      margin-bottom: 10px;
    }

    .future-box p {
      color: #d0d5dd;
      line-height: 1.6;
      font-size: 14px;
    }

    .future-status {
      display: inline-block;
      margin-top: 18px;
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 999px;
      font-size: 12px;
      color: #d0d5dd;
    }

    footer {
      background: #111827;
      color: white;
      text-align: center;
      padding: 30px;
      line-height: 1.7;
    }

    footer p:last-child {
      color: #98a2b3;
      font-size: 13px;
    }

    @media (max-width: 700px) {

      .container {
        width: 94%;
      }

      .identity {
        padding: 27px;
        border-radius: 25px;
      }

      .photo-section {
        padding: 18px;
        border-radius: 23px;
      }

      .photo-heading {
        display: block;
      }

      .photo-heading p {
        margin-top: 8px;
        text-align: left;
      }

      .photo-grid {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 180px 120px;
      }

      .capabilities {
        grid-template-columns: 1fr;
      }

      .section {
        padding: 22px;
      }

      .truth-row {
        flex-direction: column;
      }

      .truth-value {
        text-align: left;
      }
    }

    @media (max-width: 450px) {

      .photo-grid {
        grid-template-columns: 1fr;
        grid-template-rows: 240px 150px 150px;
      }

      .photo-card:first-child {
        grid-row: auto;
      }

    }
  </style>
</head>

<body>

<header>

  <div class="logo">

  </div>

</header>


<main class="container">

  <div id="content">

    <div class="loading">

<!-- PHOTO VIEWER -->

<div

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const SUPABASE_URL =
    "https://vyfuuvsuewzsoyjdfjfu.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_9if2DNlYzWq4GtmQjOx9BQ_nqCdHCEm";


  const localLinkSupabase =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  const content =
    document.getElementById("content");


  /*

    They do NOT claim that ordering, booking,

        ],

        ],
        [

        ],

          "Ordering and delivery can be connected here when those systems are built."
        ]
      ];

    }


    if (
      category.includes("manufacturing") ||
      sub.includes("manufacturer") ||
      sub.includes("wholesaler") ||
      sub.includes("distributor")
    ) {

      return [

        ],
        [
          "02",
          "Business enquiry",

        ],
        [
          "03",
          "Business identity",

        ],
        [
          "04",
          "Future commerce",
          "Wholesale ordering can be connected when that system is built."
        ]
      ];

    }


    if (
      category.includes("education") ||
      sub.includes("school") ||
      sub.includes("tuition") ||
      sub.includes("coaching")
    ) {

      return [
        [

          "Learning",
          "Explore the educational services offered by this business."
        ],
        [
          "02",
          "Programs",
          "Courses and programs can be displayed here."
        ],
        [
          "03",
          "Direct contact",
          "Use the real contact information supplied by the business."
        ],
        [
          "04",
          "Future admissions",
          "Online enquiries and applications can be connected later."
        ]
      ];

    }


    if (
      category.includes("transport") ||
      sub.includes("cab") ||
      sub.includes("taxi") ||
      sub.includes("delivery") ||
      sub.includes("logistics")
    ) {

      return [
        [
          "01",
          "Transport service",
          "Understand the transport service offered by this business."
        ],
        [
          "02",
          "Service area",
          "Service-area information can be displayed here."
        ],
        [
          "03",

        ],

        ]
      ];

    }


    if (
      category.includes("entertainment") ||
      category.includes("media") ||
      sub.includes("events") ||
      sub.includes("video") ||
      sub.includes("music")
    ) {

      return [
        [
          "01",
          "Media & work",
          "Show the creative work and services offered by this business."
        ],
        [
          "02",
          "Portfolio",
          "Photos and videos can become part of the business profile."
        ],
        [
          "03",

    }


    return [
      [
        "01",

      ],
      [
        "02",

      ],
      [
        "03",
        "Direct contact",

      [

    ];

  }


  function renderCapabilities(mainCategory, subCategory) {

    const capabilities =
      getCapabilities(
        mainCategory,
        subCategory
      );


    return capabilities.map(function(item) {

      return `

        <div class="capability">

          <div class="capability-number">
            ${item[0]}
          </div>

          <div class="capability-title">
            ${escapeHtml(item[1])}
          </div>

          <div class="capability-text">
            ${escapeHtml(item[2])}
          </div>

        </div>

      `;

    }).join("");

  }


  /*
    Load the real photos belonging to this business.

    Folder structure:

    business-photos/
      USER_ID/
        BUSINESS_ID/
          PHOTO.jpg
  */

  async function loadBusinessPhotos(businessId) {

    try {

      const {
        data: sessionData
      } =
        await localLinkSupabase
          .auth
          .getSession();


      /*
        The public bucket lets customers see the
        actual image using getPublicUrl().

        We first obtain the business owner ID
        from the businesses table.
      */

      const {
        data: businessOwner,
        error: ownerError
      } =
        await localLinkSupabase
          .from("businesses")
          .select("owner_id")
          .eq("id", businessId)
          .single();


      if (ownerError || !businessOwner) {

        console.error(
          "Unable to find photo owner:",
          ownerError
        );

        return [];

      }


      const ownerId =
        businessOwner.owner_id;


      const folder =
        `${ownerId}/${businessId}`;


      const {
        data: files,
        error
      } =
        await localLinkSupabase
          .storage
          .from("business-photos")
          .list(folder, {
            limit: 100,
            offset: 0,
            sortBy: {
              column: "created_at",
              order: "asc"
            }
          });


      if (error) {

        console.error(
          "Photo list error:",
          error
        );

        return [];

      }


      if (!files || files.length === 0) {

        return [];

      }


      const imageFiles =
        files.filter(function(file) {

          return (
            file &&
            file.name &&
            !file.name.endsWith("/")
          );

        });


      return imageFiles.map(function(file) {

        const fullPath =
          `${folder}/${file.name}`;


        const {
          data
        } =
          localLinkSupabase
            .storage
            .from("business-photos")
            .getPublicUrl(fullPath);


        return {
          name: file.name,
          url: data.publicUrl
        };

      });

    } catch (error) {

      console.error(
        "Unexpected photo error:",
        error
      );

      return [];

    }

  }


  function getPhotoDescription(
    mainCategory,
    subCategory
  ) {

    const category =
      String(mainCategory || "").toLowerCase();

    const sub =
      String(subCategory || "").toLowerCase();


    if (
      category.includes("food") ||
      sub.includes("restaurant") ||
      sub.includes("bakery") ||
      sub.includes("cafe")
    ) {

      return "Real photos from this business.";

    }


    if (
      category.includes("entertainment") ||
      category.includes("media")
    ) {

      return "A visual portfolio from this business.";

    }


    if (
      category.includes("manufacturing")
    ) {

      return "Real products, work or facilities from this business.";

    }


    return "Real photos provided by this business.";

  }


  function renderPhotos(
    photos,
    mainCategory,
    subCategory
  ) {

    if (!photos || photos.length === 0) {

      return `

        <section class="photo-section">

          <div class="photo-heading">

            <div>

              <div class="photo-heading-label">
                VISUAL IDENTITY
              </div>

              <h2>
                Business showcase
              </h2>

            </div>

          </div>

          <div class="photo-empty">

            No business photos have been added yet.

            <br>

            Photos uploaded by the business
            will appear here automatically.

          </div>

        </section>

      `;

    }


    const visiblePhotos =
      photos.slice(0, 3);


    const cards =
      visiblePhotos.map(function(photo, index) {

        return `

          <div
            class="photo-card"
            data-photo-url="${escapeHtml(photo.url)}"
          >

            <img
              src="${escapeHtml(photo.url)}"
              alt="Photo ${index + 1} from this business"
              loading="${index === 0 ? "eager" : "lazy"}"
            >

            <div class="photo-number">
              ${index + 1} / ${photos.length}
            </div>

          </div>

        `;

      }).join("");


    return `

      <section class="photo-section">

        <div class="photo-heading">

          <div>

            <div class="photo-heading-label">
              VISUAL IDENTITY
            </div>

            <h2>
              Business showcase
            </h2>

          </div>

          <p>
            ${escapeHtml(
              getPhotoDescription(
                mainCategory,
                subCategory
              )
            )}
          </p>

        </div>


        <div class="photo-grid">

          ${cards}

        </div>

      </section>

    `;

  }


  function activatePhotoViewer() {

    const viewer =
      document.getElementById("photoViewer");

    const viewerImage =
      document.getElementById("viewerImage");

    const closeButton =
      document.getElementById("viewerClose");


    document
      .querySelectorAll(".photo-card")
      .forEach(function(card) {

        card.addEventListener(
          "click",
          function() {

            const url =
              card.dataset.photoUrl;


            if (!url) {
              return;
            }


            viewerImage.src =
              url;


            viewer.classList.add("open");

          }
        );

      });


    closeButton.addEventListener(
      "click",
      function() {

        viewer.classList.remove("open");

        viewerImage.src = "";

      }
    );


    viewer.addEventListener(
      "click",
      function(event) {

        if (event.target === viewer) {

          viewer.classList.remove("open");

          viewerImage.src = "";

        }

      }
    );


    document.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Escape") {

          viewer.classList.remove("open");

          viewerImage.src = "";

        }

      }
    );

  }


  async function loadBusiness() {

    const params =
      new URLSearchParams(
        window.location.search
      );


    const businessId =
      params.get("id");


    if (!businessId) {

      content.innerHTML = `

        <div class="error">

          <strong>
            Business not found.
          </strong>

          <br><br>

          No business ID was provided.

        </div>

      `;

      return;

    }


    const {
      data,
      error
    } =
      await localLinkSupabase
        .from("businesses")
        .select(`
          id,
          owner_id,
          business_name,
          contact_name,
          email,
          phone,
          main_category,
          sub_category,
          city,
          address,
          description,
          created_at
        `)
        .eq("id", businessId)
        .single();


    if (error || !data) {

      console.error(
        "Business details error:",
        error
      );


      content.innerHTML = `

        <div class="error">

          <strong>
            Unable to load this business.
          </strong>

          <br><br>

          The business may not exist
          or may no longer be available.

        </div>

      `;

      return;

    }


    /*
      Load the real photos after the business
      itself has been successfully found.
    */

    const photos =
      await loadBusinessPhotos(
        businessId
      );


    const capabilities =
      renderCapabilities(
        data.main_category,
        data.sub_category
      );


    content.innerHTML = `

      <!-- BUSINESS IDENTITY -->

      <section class="identity">

        <div class="identity-content">

          <div class="identity-label">
            LOCAL BUSINESS
          </div>

          <h1 class="business-name">
            ${escapeHtml(data.business_name)}
          </h1>

          <p class="category-line">
            ${escapeHtml(data.main_category)}
            <br>
            ${escapeHtml(data.sub_category)}
          </p>

          <div class="location-chip">
            ◉ ${escapeHtml(data.city)}
          </div>

        </div>

      </section>


      <!-- REAL BUSINESS PHOTOS -->

      ${renderPhotos(
        photos,
        data.main_category,
        data.sub_category
      )}


      <!-- ADAPTIVE CAPABILITIES -->

      <section>

        <div style="margin: 25px 0 14px;">

          <div class="section-label">
            BUSINESS INTERFACE
          </div>

          <h2>
            What this business can offer
          </h2>

        </div>

        <div class="capabilities">

          ${capabilities}

        </div>

      </section>


      <!-- ABOUT -->

      <section class="section">

        <div class="section-label">
          THE BUSINESS
        </div>

        <h2>
          About
        </h2>

        <p>
          ${escapeHtml(data.description)}
        </p>

      </section>


      <!-- HONESTY / TRUST -->

      <section class="section">

        <div class="section-label">
          INFORMATION ORIGIN
        </div>

        <h2>
          Know what you're seeing
        </h2>

        <div class="truth">

          <div class="truth-row">

            <span class="truth-label">
              Business information
            </span>

            <span class="truth-value">
              Supplied by business
            </span>

          </div>


          <div class="truth-row">

            <span class="truth-label">
              Business name
            </span>

            <span class="truth-value">
              ${escapeHtml(data.business_name)}
            </span>

          </div>


          <div class="truth-row">

            <span class="truth-label">
              Category
            </span>

            <span class="truth-value">
              ${escapeHtml(data.main_category)}
            </span>

          </div>


          <div class="truth-row">

            <span class="truth-label">
              AI-created information
            </span>

            <span class="truth-value">
              None shown
            </span>

          </div>

        </div>

      </section>


      <!-- LOCATION -->

      <section class="section">

        <div class="section-label">
          WHERE
        </div>

        <h2>
          Location
        </h2>

        <div class="info">

          <div class="info-row">

            <span class="info-label">
              City
            </span>

            <span class="info-value">
              ${escapeHtml(data.city)}
            </span>

          </div>


          <div class="info-row">

            <span class="info-label">
              Address
            </span>

            <span class="info-value">
              ${escapeHtml(data.address)}
            </span>

          </div>

        </div>

      </section>


      <!-- CONTACT -->

      <section class="section">

        <div class="section-label">
          CONNECTION
        </div>

        <h2>
          Contact
        </h2>

        <div class="info">

          <div class="info-row">

            <span class="info-label">
              Contact person
            </span>

            <span class="info-value">
              ${escapeHtml(data.contact_name)}
            </span>

          </div>


          <div class="info-row">

            <span class="info-label">
              Phone
            </span>

            <span class="info-value">
              ${escapeHtml(data.phone)}
            </span>

          </div>


          <div class="info-row">

            <span class="info-label">
              Email
            </span>

            <span class="info-value">
              ${escapeHtml(data.email)}
            </span>

          </div>

        </div>

      </section>


      <!-- FUTURE WEBSITE -->

      <section class="future-box">

        <div class="section-label">
          LOCAL LINK WEBSITE
        </div>

        <h2>
          This business can grow beyond a profile.
        </h2>

        <p>
          A complete public business website will eventually
          live here, with products, services, media and
          business-specific tools.
        </p>

        <span class="future-status">
          Website not created yet
        </span>

      </section>

    `;


    /*
      Activate the real photo viewer only after
      the business content has been rendered.
    */

    activatePhotoViewer();

  }


  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  loadBusiness();

</script>

</body>
</html>
